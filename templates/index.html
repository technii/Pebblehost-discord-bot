<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
      body {background-color: rgb(40, 40, 40);}
    </style>
    <title>Hello, world!</title>
  </head>
  <body>
    <div class="p-3 mb-2 bg-dark text-white">
      <h1>File Upload!</h1>
      <form onsubmit="upload(this)">
        <div class="mb-3">
          <label for="formFile" class="form-label">MP3 Please</label>
          <input class="form-control" type="file" id="formFile" name="SoundFile" accept=".mp3">
          <input class="form-control" type="text" name="SoundName" id="formText">
          <input class="form-label" type="submit" value="Submit">
        </div>
      </form>
    

  
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
      <script>
        const soundfile = document.getElementById("formFile");
        async function upload(that) {
          var data = new FormData()
          data.append("SoundFile", soundfile.files[0])
          data.append("SoundName",that.SoundName.value)
          try{
            response = await fetch("/UploadSound",{method:"POST",body:data},)
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }
          }
          catch (error){console.error(error.message)}
        }

      </script>
  </body>
</html>
